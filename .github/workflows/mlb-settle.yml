name: MLB 賽後結算守候
# GitHub 定時排程常常延遲數小時，所以這個流程啟動後會一直守著比賽（每 10 分鐘看一次），
# 比賽一結束就結算；單次最多 5 小時 40 分，還沒結算完就自動開下一輪接手。
# 下面的排程只是「叫醒」用：已經有一輪在守就馬上結束。
on:
  schedule:
    - cron: "4,26,48 * * * *"
  workflow_dispatch:
    inputs:
      chain: { description: "上一輪交棒（自動用）", required: false, default: "0" }
permissions:
  contents: write
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 守候並結算
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898810+github-actions[bot]@users.noreply.github.com"
          python3 scripts/settle_watch.py
