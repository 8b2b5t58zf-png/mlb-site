name: 盤口對照紀錄（內部）
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: odds-log, cancel-in-progress: false }
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/log_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: 提交盤口資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898810+github-actions[bot]@users.noreply.github.com"
          git add data/odds
          git diff --cached --quiet || (git commit -m "更新內部盤口對照資料" && git pull --rebase && git push)
