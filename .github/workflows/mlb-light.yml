name: MLB 先發輕量檢查（每 15 分鐘）
# 只有 4 小時內開打、先發還沒都公布的比賽才連 1 次 API；先發有變才跑完整紀錄（只更新那幾場）並提交
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: mlb-log, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: python3 scripts/mlb_light.py
      - if: steps.chk.outputs.pks != ''
        env: { ONLY_PKS: "${{ steps.chk.outputs.pks }}" }
        run: python3 scripts/log_predictions.py
      - if: steps.chk.outputs.pks != ''
        name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898810+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          git diff --cached --quiet || (git commit -m "先發更新：MLB 預測紀錄" && git pull --rebase && git push)
