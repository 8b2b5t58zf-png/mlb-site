name: 每小時 MLB 預測紀錄
concurrency: { group: mlb-log, cancel-in-progress: false }
on:
  schedule:
    - cron: "19,49 * * * *"   # 避開整點與 :15 的排程尖峰；結算主要靠 mlb-settle.yml 守候
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/log_predictions.py
      - name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898810+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          git diff --cached --quiet || { git commit -m "更新 MLB 預測紀錄"; for i in 1 2 3; do git pull --rebase && git push && exit 0; git rebase --abort 2>/dev/null; git reset -q --hard origin/main; python scripts/log_predictions.py; git add data/predictions.json; git diff --cached --quiet && exit 0; git commit -q -m "更新 MLB 預測紀錄"; sleep 15; done; exit 1; }
