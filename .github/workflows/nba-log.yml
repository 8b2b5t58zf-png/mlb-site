name: NBA 資料與預測紀錄
# 台灣時間 22:00、06:00、07:30（賽前）與 14:00（賽後）；正式預測＝開賽前最後一筆（log_nba.py 開賽後不再改）
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "30 23 * * *"
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_nba.py
        continue-on-error: true
      - run: python scripts/log_nba.py
      - name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898810+github-actions[bot]@users.noreply.github.com"
          git add data/nba-predictions.json data/nba
          # 同一時間有別的提交時 push 會被拒（10/17 09:28 那次就是這樣漏掉），最多重試 3 次
          git diff --cached --quiet || { git commit -m "更新 NBA 資料與預測紀錄"; for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1; }
      - name: 接著啟動賽程守候（GitHub 每小時叫醒常被跳過，10/31 06:00 漏掉；守候程式會自己等到第一場開打前 60 分鐘，已有一輪在跑就直接結束）
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run nba-watch.yml --ref main || echo "啟動守候失敗，交給每小時叫醒"
